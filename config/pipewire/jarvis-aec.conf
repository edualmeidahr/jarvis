# Microfone sem eco, só para o Jarvis. Roda como processo próprio (serviço jarvis-aec),
# sem tocar na configuração principal do som: parar o serviço desfaz tudo, sem reiniciar
# o áudio (o que derrubaria o Meet e a música).
#
# O cancelamento de eco (motor do WebRTC, o mesmo do Meet) pega o microfone de verdade e
# tira dele o que está saindo pela saída padrão (o "monitor" dela). Resultado: a música e
# a voz do próprio Jarvis quase não chegam ao detector do "Ei Jarvis".
#
# O Meet e os outros apps continuam no microfone normal: este nó tem prioridade baixa e
# nunca vira o microfone padrão.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # referência = o que sai na saída padrão (alto-falante ou fone), sem criar saída nova
            monitor.mode = true
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.extended_filter = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                # sem ganho automático: o detector já lida com volume, e o AGC "puxa" ruído
                webrtc.gain_control = false
            }
            capture.props = {
                node.name = "jarvis_aec_entrada"
                node.description = "Jarvis — entrada do cancelamento de eco"
                node.passive = true
            }
            source.props = {
                node.name = "jarvis_mic_sem_eco"
                node.description = "Jarvis — microfone sem eco"
                # baixa: nunca vira o microfone padrão do sistema
                priority.session = 1
                priority.driver = 1
            }
        }
    }
]
