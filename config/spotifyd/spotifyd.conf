# spotifyd: o player do Jarvis. Aparece na sua conta como o dispositivo "Jarvis", sem janela.
# O Jarvis manda tocar pela Web API do Spotify (bin/spotify.py) apontando para este dispositivo.
[global]
device_name = "Jarvis"
device_type = "computer"
backend = "pulseaudio"           # o PipeWire atende como PulseAudio; o som sai no stream "spotifyd"
bitrate = 320
initial_volume = 100
volume_normalisation = true      # músicas de álbuns diferentes no mesmo volume
autoplay = true                  # no fim da fila, segue com parecidas (como o app)
use_mpris = true                 # aparece no controle de mídia do sistema e no "que música é essa?"
max_cache_size = 1000000000      # 1 GB de áudio em cache (a pasta vem pelo --cache-path do serviço:
                                 # o spotifyd não expande o "~" e criava uma pasta chamada "~")
# descoberta na rede DESLIGADA: na rede da empresa, ninguém mais vê nem usa este dispositivo.
# O login é pelo "spotifyd authenticate" (OAuth), uma vez
disable_discovery = true
