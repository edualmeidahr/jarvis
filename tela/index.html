<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<style>
  /* A tela do Jarvis. Servida por bin/tela.py em 127.0.0.1; pergunta /dados a cada meio segundo.
     Esfera no centro (a cor diz o estado), cartões em volta (acendem quando ele fala do assunto),
     legenda embaixo (a frase que está sendo falada). */
  :root {
    --fundo: #050b16;
    --fundo-2: #0a1528;
    --cartao: rgba(14, 32, 58, 0.62);
    --borda: rgba(110, 190, 255, 0.16);
    --texto: #e6f1ff;
    --texto-2: #9fb6d1;
    --texto-3: #5f7795;
    /* um tom por estado: é a única cor que significa alguma coisa na tela */
    --parado: #4fb3ff;
    --ouvindo: #2f8cff;
    --pensando: #f2b33d;
    --falando: #36d39a;
    --acento: var(--parado);
    --brilho: rgba(79, 179, 255, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--fundo-2) 0%, var(--fundo) 70%);
    color: var(--texto);
    font: 15px/1.35 "Inter", "Cantarell", "Ubuntu", system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  body.ouvindo  { --acento: var(--ouvindo);  --brilho: rgba(47, 140, 255, 0.45); }
  body.pensando { --acento: var(--pensando); --brilho: rgba(242, 179, 61, 0.40); }
  body.falando  { --acento: var(--falando);  --brilho: rgba(54, 211, 154, 0.40); }

  /* grade fina de fundo, como um painel de instrumentos */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(110,190,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(110,190,255,.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .tela {
    position: relative; height: 100vh; padding: 24px 32px 16px;
    display: grid; gap: 16px 24px;
    grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.35fr) minmax(260px, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "topo topo topo" "linha linha linha" "esq centro dir" "legenda legenda legenda";
  }

  /* topo: relógio à esquerda, nome no meio, estado à direita */
  .topo { grid-area: topo; display: flex; align-items: flex-start; justify-content: space-between; }
  .relogio .hora { font-size: 54px; font-weight: 200; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .relogio .data { color: var(--texto-2); margin-top: 2px; }
  .marca { text-align: center; letter-spacing: 10px; font-weight: 300; font-size: 20px; color: var(--texto-2); padding-top: 10px; }
  .marca b { color: var(--texto); font-weight: 600; }
  .situacao { text-align: right; padding-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); font-size: 14px;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--acento); box-shadow: 0 0 10px var(--acento); }
  .situacao .sub { color: var(--texto-3); font-size: 13px; margin-top: 6px; }

  /* a folga em volta deixa o brilho do cartão aceso aparecer sem ser cortado pela coluna */
  .coluna { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; padding: 16px; margin: -16px; }
  .coluna .cartao { flex: 0 0 auto; }
  /* as notícias ocupam o que sobra e somem num degradê em vez de serem cortadas */
  .coluna .cartao.estica { flex: 0 1 auto; min-height: 96px; overflow: hidden; }
  .cartao.estica .conteudo { -webkit-mask-image: linear-gradient(#000 calc(100% - 32px), transparent); mask-image: linear-gradient(#000 calc(100% - 32px), transparent); }
  .esq { grid-area: esq; } .dir { grid-area: dir; }

  /* cartões */
  .cartao {
    position: relative; padding: 16px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(20, 44, 78, 0.70), rgba(10, 24, 44, 0.55));
    border: 1px solid var(--borda); backdrop-filter: blur(6px);
    transition: border-color .4s, box-shadow .4s, transform .4s, opacity .4s;
  }
  .cartao h3 {
    font-size: 11px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase;
    color: var(--texto-3); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .cartao h3 > span:first-child::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px;
    background: var(--acento); box-shadow: 0 0 8px var(--acento); vertical-align: 1px; opacity: .8;
  }
  .cartao.aceso { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento), 0 0 16px var(--brilho); transform: scale(1.02); }
  /* enquanto ele fala de um assunto, os outros cartões recuam */
  body.foco .cartao:not(.aceso) { opacity: .38; filter: saturate(.5); }
  .cartao.vazio { opacity: .55; }
  .numero { font-size: 46px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  .numero small { font-size: 18px; color: var(--texto-2); margin-left: 2px; }
  .linha { display: flex; justify-content: space-between; gap: 12px; color: var(--texto-2); margin-top: 8px; font-size: 14px; }
  .linha b { color: var(--texto); font-weight: 500; }
  ul.lista { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  ul.lista li { color: var(--texto-2); font-size: 14px; display: flex; gap: 8px; min-width: 0; }
  ul.lista li > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  ul.lista li .h { color: var(--texto); font-variant-numeric: tabular-nums; min-width: 44px; }
  ul.lista li.agora .h::after { content: " ●"; color: var(--acento); }
  .noticia { color: var(--texto); font-size: 14px; padding: 8px 0; border-top: 1px solid var(--borda);
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .noticia:first-of-type { border-top: 0; padding-top: 0; }
  .noticia span { display: block; color: var(--texto-3); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
  .musica { color: var(--texto); font-size: 15px; }
  .musica .onde { color: var(--texto-3); font-size: 12px; margin-top: 4px; }
  /* tocando agora (Spotify): capa, música, progresso e a próxima */
  .faixa { display: flex; gap: 12px; align-items: center; }
  .faixa img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .faixa > div { min-width: 0; }
  .faixa .t { color: var(--texto); font-size: 15px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .faixa .a { color: var(--texto-2); font-size: 13px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra { height: 3px; border-radius: 2px; background: rgba(110,190,255,.15); margin-top: 12px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--acento); transition: width .9s linear; }
  .tempos { display: flex; justify-content: space-between; color: var(--texto-3); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .seguir { color: var(--texto-3); font-size: 12px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* próxima reunião, embaixo do nome */
  .contagem { margin-top: 8px; font-size: 13px; letter-spacing: 1px; color: var(--texto-2); }
  .contagem b { color: var(--texto); font-weight: 500; }
  body.reuniao-perto .contagem b { color: var(--alerta); }
  :root { --alerta: #ff8a4c; }

  /* linha do tempo do dia: reuniões, livres e o agora */
  .linha-tempo { grid-area: linha; position: relative; height: 34px; margin-top: -6px; }
  body.sem-linha .linha-tempo { display: none; }
  .trilho { position: absolute; left: 0; right: 0; top: 12px; height: 8px; border-radius: 4px; background: rgba(110,190,255,.08); border: 1px solid var(--borda); }
  .trilho .passado { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px 0 0 4px; background: rgba(110,190,255,.10); }
  .trilho .bloco { position: absolute; top: -3px; bottom: -3px; border-radius: 4px; background: var(--acento); opacity: .75; box-shadow: 0 0 10px var(--brilho); }
  .trilho .bloco.foi { opacity: .3; box-shadow: none; }
  .trilho .agora { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--texto); box-shadow: 0 0 8px var(--texto); }
  .marcas { position: absolute; left: 0; right: 0; top: 24px; height: 12px; color: var(--texto-3); font-size: 10px; font-variant-numeric: tabular-nums; }
  .marcas span { position: absolute; transform: translateX(-50%); }
  .rotulo-bloco { position: absolute; top: -16px; transform: translateX(-50%); font-size: 10px; color: var(--texto-2); white-space: nowrap; }
  .rotulo-bloco.inicio { transform: none; } .rotulo-bloco.fim { transform: translateX(-100%); }

  /* tela baixa (o notebook, 768 px): tudo um pouco menor para caber sem cortar */
  @media (max-height: 820px) {
    .tela { padding: 16px 24px 8px; gap: 8px 16px; }
    .relogio .hora { font-size: 40px; }
    .relogio .data { font-size: 13px; }
    .marca { font-size: 16px; letter-spacing: 8px; padding-top: 4px; }
    .situacao { padding-top: 4px; }
    .coluna { gap: 8px; }
    .cartao { padding: 12px 16px; border-radius: 12px; }
    .cartao h3 { margin-bottom: 8px; }
    .numero { font-size: 36px; }
    .linha { margin-top: 4px; font-size: 13px; }
    ul.lista { gap: 4px; }
    ul.lista li { font-size: 13px; }
    .noticia { font-size: 13px; padding: 4px 0; -webkit-line-clamp: 2; }
    .faixa img { width: 48px; height: 48px; }
    .barra { margin-top: 8px; }
    .seguir { margin-top: 4px; }
    .legenda { min-height: 44px; }
  }

  /* centro: a esfera */
  .centro { grid-area: centro; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 8px; }
  canvas#esfera { flex: 0 1 auto; height: min(100%, 62vh); max-width: 100%; aspect-ratio: 1; min-height: 0; }
  .rotulo-centro { flex: 0 0 auto; color: var(--texto-3); font-size: 11px; letter-spacing: 6px; text-transform: uppercase; }

  /* legenda: a frase que ele está falando */
  .legenda {
    grid-area: legenda; min-height: 56px; display: grid; place-items: center; text-align: center;
    font-size: clamp(18px, 1.9vw, 26px); font-weight: 300; color: var(--texto); padding: 0 12%;
    text-shadow: 0 0 18px rgba(0,0,0,.6); transition: opacity .3s;
  }
  .legenda.some { opacity: 0; }

  @media (max-width: 900px) {
    .tela { grid-template-columns: 1fr; grid-template-areas: "topo" "linha" "centro" "esq" "dir" "legenda"; overflow-y: auto; height: auto; }
    body { overflow: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .cartao { transition: none; } }
</style>
</head>
<body>
<div class="tela">
  <header class="topo">
    <div class="relogio"><div class="hora" id="hora">--:--</div><div class="data" id="data"></div></div>
    <div class="marca"><b>J.A.R.V.I.S</b><div class="contagem" id="contagem"></div></div>
    <div class="situacao">
      <span class="chip"><i></i><span id="estado">Em espera</span></span>
      <div class="sub" id="escuta"></div>
    </div>
  </header>

  <div class="linha-tempo" id="linha-tempo"><div class="trilho" id="trilho"></div><div class="marcas" id="marcas"></div></div>

  <section class="coluna esq">
    <article class="cartao" id="c-clima" data-assunto="clima">
      <h3><span>Clima</span><span id="cidade"></span></h3>
      <div class="numero" id="temp">--<small>°C</small></div>
      <div class="linha"><span id="ceu">—</span></div>
      <div class="linha"><span>Hoje</span><b id="minmax">—</b></div>
      <div class="linha"><span>Chance de chuva</span><b id="chuva">—</b></div>
    </article>
    <article class="cartao" id="c-agenda" data-assunto="agenda">
      <h3><span>Agenda de hoje</span></h3>
      <ul class="lista" id="reunioes"></ul>
    </article>
    <article class="cartao" id="c-lembretes" data-assunto="lembretes">
      <h3><span>Lembretes</span></h3>
      <ul class="lista" id="lembretes"></ul>
    </article>
  </section>

  <section class="centro">
    <canvas id="esfera" width="800" height="800" aria-hidden="true"></canvas>
    <div class="rotulo-centro" id="rotulo">em espera</div>
  </section>

  <section class="coluna dir">
    <article class="cartao" id="c-trabalho" data-assunto="trabalho">
      <h3><span>Trabalho</span></h3>
      <ul class="lista" id="trabalho"></ul>
    </article>
    <article class="cartao" id="c-musica" data-assunto="musica">
      <h3><span>Tocando agora</span><span id="m-onde"></span></h3>
      <div id="m-spotify" hidden>
        <div class="faixa"><img id="m-capa" alt=""><div><div class="t" id="m-titulo"></div><div class="a" id="m-artista"></div></div></div>
        <div class="barra"><i id="m-barra"></i></div>
        <div class="tempos"><span id="m-pos"></span><span id="m-dur"></span></div>
        <div class="seguir" id="m-proxima"></div>
      </div>
      <div class="musica" id="musica">—</div>
    </article>
    <article class="cartao estica" id="c-noticias" data-assunto="noticias">
      <h3><span>Notícias</span><span id="melhorias"></span></h3>
      <div class="conteudo" id="noticias"></div>
    </article>
  </section>

  <footer class="legenda some" id="legenda"></footer>
</div>

<script>
// ------------------------------------------------------------------ dados
const NOMES = { parado: "Em espera", ouvindo: "Ouvindo", pensando: "Pensando", falando: "Falando" };
// o assunto da frase falada acende o cartão; a ordem importa (a primeira que casar ganha)
const ASSUNTOS = [
  ["clima", /\b(graus?|chuva|chover|clima|temperatura|c[eé]u|nublad|ensolarad|garoa|frio|calor|guarda-chuva)/i],
  ["agenda", /\b(reuni[aã]o|reuni[õo]es|daily|planning|review|agenda|compromisso)/i],
  ["trabalho", /\b(MR|merge|thread|threads|gitlab|tarefa|tarefas|issue)/i],
  ["musica", /\b(tocando|m[uú]sica|playlist|faixa|volume|ouvir|tocar)/i],
  ["noticias", /\b(not[ií]cias?|manchete|melhorias?)/i],
  ["lembretes", /\b(lembrete|lembrar|lembro|rotina)/i],
];
const $ = (id) => document.getElementById(id);
let estado = "parado";
// o assunto fica aceso entre uma frase e outra (as notícias não repetem "notícia" a cada manchete);
// dentro das notícias, só a música (a oferta do fim do bom dia) troca o assunto
let assuntoFixo = null, ultimaFala = 0, dados = {}, musicaAtual = null;
const SEM_LINHA = new URLSearchParams(location.search).has("sem-linha");

function classesDoCorpo() {
  const perto = document.body.dataset.perto === "1";
  document.body.className = [estado, assuntoFixo ? "foco" : "", perto ? "reuniao-perto" : "", SEM_LINHA ? "sem-linha" : ""]
    .filter(Boolean).join(" ");
}

function texto(el, valor) { if (el.textContent !== valor) el.textContent = valor; }

function lista(el, itens, vazio) {
  const html = itens.length ? itens.join("") : `<li>${vazio}</li>`;
  if (el.innerHTML !== html) el.innerHTML = html;
  el.closest(".cartao").classList.toggle("vazio", !itens.length);
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function desenhar(d) {
  dados = d;
  estado = d.estado in NOMES ? d.estado : "parado";
  texto($("estado"), NOMES[estado]);
  texto($("rotulo"), estado === "parado" ? "em espera" : NOMES[estado].toLowerCase());
  texto($("escuta"), d.escuta ? "diga “Ei Jarvis”" : "escuta desligada — use o Insert");

  // legenda e cartão aceso
  const frase = estado === "falando" ? d.detalhe : "";
  texto($("legenda"), frase);
  $("legenda").classList.toggle("some", !frase);
  if (frase) {
    const candidatos = ASSUNTOS.filter(([nome]) => assuntoFixo !== "noticias" || nome === "musica");
    const achado = candidatos.find(([, re]) => re.test(frase));
    if (achado) assuntoFixo = achado[0];
    ultimaFala = Date.now();
  } else if (Date.now() - ultimaFala > 2500) {
    assuntoFixo = null;
  }
  document.querySelectorAll(".cartao").forEach((c) => c.classList.toggle("aceso", c.dataset.assunto === assuntoFixo));
  classesDoCorpo();

  // clima
  if (d.clima) {
    const a = d.clima.agora, dia = d.clima.dias;
    texto($("cidade"), d.clima.cidade || "");
    $("temp").innerHTML = `${Math.round(a.temperature_2m)}<small>°C</small>`;
    texto($("ceu"), CEU[a.weather_code] || "");
    texto($("minmax"), `${Math.round(dia.temperature_2m_min[0])}° – ${Math.round(dia.temperature_2m_max[0])}°`);
    texto($("chuva"), `${dia.precipitation_probability_max[0]}%`);
  }
  lista($("reunioes"), (d.reunioes || []).map((r) =>
    `<li class="${r.agora ? "agora" : ""}"><span class="h">${esc(r.hora)}</span><span>${esc(r.titulo)}</span></li>`),
    "Nenhuma reunião pela frente");
  lista($("lembretes"), (d.lembretes || []).slice(0, 4).map((l) => {
    const [desc, quando] = l.split(" — ").length > 1 ? [l.slice(0, l.lastIndexOf(" — ")), l.slice(l.lastIndexOf(" — ") + 3)] : [l, ""];
    return `<li><span class="h">${esc(quando.split(" ").pop())}</span><span>${esc(desc.replace(/^(Lembrete|Rotina( \(comando\))?): /, ""))}</span></li>`;
  }), "Nenhum lembrete");
  // "MR 202 (3 thread(s) aberta(s), 1 na vez dele)" é o texto para o Claude; aqui, mais curto
  const mr = (t) => t.replace(/^MR (\d+) \((\d+) thread\(s\) aberta\(s\), (\d+) na vez dele\)$/, (_, n, a, v) =>
    `MR ${n} · ${a === "0" ? "sem threads abertas" : `${a} thread${a === "1" ? "" : "s"} aberta${a === "1" ? "" : "s"}`}${v !== "0" ? ` · ${v} esperando você` : ""}`);
  const trabalho = [...(d.mrs || []).map(mr), ...(d.reviews || []).map((r) => "Review: " + r), ...(d.tarefas || []).slice(0, 3)]
    .map((t) => `<li><span>${esc(t.replace(/ — \S+ \d{4}-\d\d-\d\d$/, ""))}</span></li>`);
  lista($("trabalho"), trabalho, "Nada pendente");
  musicaAtual = d.musica;
  $("m-spotify").hidden = !d.musica;
  $("musica").hidden = !!d.musica;
  if (d.musica) {
    if ($("m-capa").getAttribute("src") !== d.musica.capa) $("m-capa").src = d.musica.capa;
    texto($("m-titulo"), (d.musica.tocando ? "" : "⏸ ") + d.musica.titulo);
    texto($("m-artista"), d.musica.artista);
    texto($("m-proxima"), d.musica.proxima ? `A seguir: ${d.musica.proxima}` : "");
    texto($("m-onde"), "Spotify");
    progresso();
  } else {
    texto($("m-onde"), "");
  }
  const m = (d.tocando || "").replace(/^Está tocando /, "").replace(/^Está pausado: /, "⏸ ");
  const onde = m.match(/ no (YouTube Music|Chrome|YouTube)\.?$/);
  $("musica").innerHTML = m && !/^Não tem nada/.test(m)
    ? `${esc(m.replace(/ no (YouTube Music|Chrome|YouTube)\.?$/, ""))}<div class="onde">${esc(onde ? onde[1] : "")}</div>`
    : `<span style="color:var(--texto-3)">Nada tocando</span>`;
  const ns = (d.noticias || []).map((n) => `<div class="noticia"><span>${esc(n.tema)}</span>${esc(n.titulo)}</div>`).join("");
  if ($("noticias").innerHTML !== ns) $("noticias").innerHTML = ns || `<div class="noticia" style="color:var(--texto-3)">Sem notícias</div>`;
  texto($("melhorias"), "");
}

const CEU = { 0: "Céu limpo", 1: "Quase sem nuvens", 2: "Parcialmente nublado", 3: "Nublado", 45: "Neblina", 48: "Neblina",
  51: "Garoa fraca", 53: "Garoa", 55: "Garoa forte", 61: "Chuva fraca", 63: "Chuva", 65: "Chuva forte", 80: "Pancadas de chuva",
  81: "Pancadas de chuva", 82: "Temporal", 95: "Tempestade", 96: "Tempestade com granizo", 99: "Tempestade com granizo" };

async function buscar() {
  try {
    const r = await fetch("/dados", { cache: "no-store" });
    desenhar(await r.json());
  } catch (e) { /* servidor reiniciando: tenta de novo no próximo ciclo */ }
}
setInterval(buscar, 500);
buscar();

const mmss = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
function progresso() {
  const m = musicaAtual;
  if (!m || !m.duracao_ms) return;
  const pos = Math.min(m.duracao_ms, m.progresso_ms + (m.tocando ? Date.now() - m.quando * 1000 : 0));
  $("m-barra").style.width = `${(100 * pos) / m.duracao_ms}%`;
  texto($("m-pos"), mmss(pos));
  texto($("m-dur"), mmss(m.duracao_ms));
}

const curto = (t) => String(t || "").split(" - ")[0];
function contagem() {
  const agora = Date.now(), dia = dados.dia || [];
  const atual = dia.find((r) => Date.parse(r.inicio) <= agora && agora < Date.parse(r.fim));
  const prox = dia.find((r) => Date.parse(r.inicio) > agora);
  let html = "", perto = false;
  if (atual) {
    html = `<b>${esc(curto(atual.titulo))}</b> agora`;
  } else if (prox) {
    const min = Math.ceil((Date.parse(prox.inicio) - agora) / 60000);
    perto = min <= 5;
    html = min <= 120 ? `<b>${esc(curto(prox.titulo))}</b> em ${min} min` : `<b>${esc(curto(prox.titulo))}</b> às ${prox.inicio.slice(11, 16)}`;
    if (perto) html += ` · diga “entrar na reunião”`;
  }
  if ($("contagem").innerHTML !== html) $("contagem").innerHTML = html;
  if (document.body.dataset.perto !== (perto ? "1" : "0")) { document.body.dataset.perto = perto ? "1" : "0"; classesDoCorpo(); }
}

function linhaDoTempo() {
  if (SEM_LINHA) return;
  const dia = dados.dia || [], hoje = new Date();
  // hora do dia em número (13.75 = 13h45); o que passa da meia-noite conta como 24h
  const h = (iso) => { const d = new Date(iso); return d.toDateString() !== hoje.toDateString() && d > hoje ? 24 : d.getHours() + d.getMinutes() / 60; };
  const ini = Math.min(8, ...dia.map((r) => Math.floor(h(r.inicio)))), fim = Math.max(19, ...dia.map((r) => Math.ceil(h(r.fim))));
  const pct = (x) => `${(100 * (x - ini)) / (fim - ini)}%`, agora = hoje.getHours() + hoje.getMinutes() / 60;
  let html = `<div class="passado" style="width:${pct(Math.max(ini, Math.min(fim, agora)))}"></div>`;
  for (const r of dia) {
    const a = h(r.inicio), b = h(r.fim), foi = Date.parse(r.fim) < Date.now();
    html += `<div class="bloco ${foi ? "foi" : ""}" style="left:${pct(a)};width:calc(${pct(b)} - ${pct(a)})" title="${esc(r.titulo)}"></div>`;
    const meio = (a + b) / 2, lado = (meio - ini) / (fim - ini) < 0.06 ? "inicio" : (meio - ini) / (fim - ini) > 0.94 ? "fim" : "";
    html += `<div class="rotulo-bloco ${lado}" style="left:${pct(lado === "inicio" ? a : lado === "fim" ? b : meio)}">${esc(curto(r.titulo))}</div>`;
  }
  if (agora >= ini && agora <= fim) html += `<div class="agora" style="left:${pct(agora)}"></div>`;
  if ($("trilho").innerHTML !== html) $("trilho").innerHTML = html;
  let marcas = "";
  for (let x = ini; x <= fim; x += 2) marcas += `<span style="left:${pct(x)}">${x}h</span>`;
  if ($("marcas").innerHTML !== marcas) $("marcas").innerHTML = marcas;
}

function relogio() {
  progresso();
  contagem();
  linhaDoTempo();
  const agora = new Date();
  texto($("hora"), agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }));
  const data = agora.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  texto($("data"), data.charAt(0).toUpperCase() + data.slice(1));
}
setInterval(relogio, 1000);
relogio();

// ------------------------------------------------------------------ a esfera
// Anéis girando e uma nuvem de pontos numa esfera. Cada estado muda velocidade, cor e "respiração":
// parado respira devagar; ouvindo abre ondas; pensando gira rápido; falando pulsa como uma voz.
const cv = $("esfera"), ctx = cv.getContext("2d");
const W = cv.width, C = W / 2;
const PONTOS = Array.from({ length: 420 }, () => {
  const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2;
  return [Math.sqrt(1 - u * u) * Math.cos(t), Math.sqrt(1 - u * u) * Math.sin(t), u];
});
const ANEIS = [ [0.86, 0.9, 1.2, [8, 10]], [0.78, -1.4, 2.4, [2, 14]], [0.70, 2.2, 1.0, [40, 18]], [0.94, -0.5, 0.8, [1, 6]] ];
const VEL = { parado: 0.25, ouvindo: 0.6, pensando: 1.8, falando: 0.9 };
let fase = 0, energia = 0, ondas = [], nivelReal = { voz: null, mic: null };
// o volume de verdade: a curva da frase que toca (falando) e o microfone (ouvindo)
async function buscarNivel() {
  if (estado !== "falando" && estado !== "ouvindo") { nivelReal = { voz: null, mic: null }; return; }
  try { nivelReal = await (await fetch("/nivel", { cache: "no-store" })).json(); } catch (e) { /* tenta no próximo */ }
}
setInterval(buscarNivel, 60);

function cor(alpha) {
  const hex = getComputedStyle(document.body).getPropertyValue("--acento").trim() || "#4fb3ff";
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function quadro(t) {
  const reduzir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const v = reduzir ? 0.05 : VEL[estado];
  fase += 0.012 * v;
  const real = estado === "falando" ? nivelReal.voz : estado === "ouvindo" ? nivelReal.mic : null;
  const alvo = real != null ? 0.2 + 0.8 * real
             : estado === "falando" ? 0.55 + 0.45 * Math.abs(Math.sin(t / 110) * Math.sin(t / 47))
             : estado === "ouvindo" ? 0.5 : estado === "pensando" ? 0.35 : 0.12 + 0.06 * Math.sin(t / 900);
  energia += (alvo - energia) * (real != null ? 0.4 : 0.15);
  // ouvindo: uma onda nova a cada pico da sua voz (sem nível, de vez em quando, como antes)
  if (estado === "ouvindo" && !reduzir && (real != null ? real > 0.45 && Math.random() < 0.25 : Math.random() < 0.03)) ondas.push(0);

  ctx.clearRect(0, 0, W, W);
  // halo
  const halo = ctx.createRadialGradient(C, C, W * 0.05, C, C, W * 0.5);
  halo.addColorStop(0, cor(0.18 + energia * 0.25));
  halo.addColorStop(1, cor(0));
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, W);

  // ondas de "ouvindo"
  ondas = ondas.filter((r) => r < 1);
  ondas.forEach((r, i) => {
    ctx.beginPath(); ctx.arc(C, C, W * (0.3 + r * 0.2), 0, Math.PI * 2);
    ctx.strokeStyle = cor(0.5 * (1 - r)); ctx.lineWidth = 2; ctx.stroke();
    ondas[i] = r + 0.012;
  });

  // anéis
  ANEIS.forEach(([raio, sentido, largura, traco]) => {
    ctx.save(); ctx.translate(C, C); ctx.rotate(fase * sentido);
    ctx.setLineDash(traco); ctx.beginPath(); ctx.arc(0, 0, W * 0.5 * raio * 0.92, 0, Math.PI * 2);
    ctx.strokeStyle = cor(0.35 + energia * 0.4); ctx.lineWidth = largura * 2; ctx.stroke(); ctx.restore();
  });

  // reunião em 5 minutos: um anel laranja pulsando por fora
  if (document.body.dataset.perto === "1") {
    ctx.beginPath(); ctx.arc(C, C, W * 0.475, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,138,76,${0.35 + 0.35 * Math.abs(Math.sin(t / 500))})`; ctx.lineWidth = 6; ctx.stroke();
  }

  // esfera de pontos
  const R = W * 0.24 * (1 + energia * 0.18);
  const ca = Math.cos(fase * 1.3), sa = Math.sin(fase * 1.3), cb = Math.cos(0.4), sb = Math.sin(0.4);
  for (const [x, y, z] of PONTOS) {
    const x1 = x * ca - z * sa, z1 = x * sa + z * ca;
    const y2 = y * cb - z1 * sb, z2 = y * sb + z1 * cb;
    const p = (z2 + 1.6) / 2.6;
    ctx.beginPath(); ctx.arc(C + x1 * R, C + y2 * R, 1.6 + p * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = cor(0.15 + p * 0.75); ctx.fill();
  }
  // núcleo
  const nucleo = ctx.createRadialGradient(C, C, 0, C, C, R * 0.55);
  nucleo.addColorStop(0, cor(0.55 + energia * 0.4)); nucleo.addColorStop(1, cor(0));
  ctx.fillStyle = nucleo; ctx.beginPath(); ctx.arc(C, C, R * 0.55, 0, Math.PI * 2); ctx.fill();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
</script>
</body>
</html>
